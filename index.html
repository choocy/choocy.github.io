<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choocy — iOS Apps by CY</title>
  <meta name="description" content="Choocy is the home of independent iOS apps by CY, including Home Assets Manager and ScanZap.">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0b0c;
      color: #f5f5f7;
      line-height: 1.6;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 72px 24px;
    }
    h1 {
      font-size: 48px;
      margin: 0 0 12px;
    }
    p {
      color: #b8b8bf;
      font-size: 18px;
    }
    .apps {
      display: grid;
      gap: 18px;
      margin-top: 40px;
    }
    .card {
      border: 1px solid #2a2a30;
      border-radius: 16px;
      padding: 24px;
      background: #141418;
    }
    .card h2 {
      margin: 0 0 8px;
    }
    a {
      color: #7dd3fc;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Choocy</h1>
    <p>Independent iOS apps by CY. Practical tools built with privacy, clarity, and everyday usefulness in mind.</p>

    <section class="apps">
      <article class="card">
        <h2>Home Assets Manager</h2>
        <p>Track household assets, warranties, QR labels, invoices, and reports.</p>
        <a href="https://choocy.github.io/homeassets-site/">View Home Assets</a>
      </article>

      <article class="card">
        <h2>ScanZap</h2>
        <p>Fast QR and barcode scanning tools. Coming soon.</p>
      </article>
    </section>
  </main>
</body>
</html>
